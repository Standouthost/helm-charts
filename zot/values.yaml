zot:
  env:
    - name: GITHUB_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: sso-secret
          key: clientSecret
  strategy:
    type: Recreate
    rollingUpdate: null
  service:
    type: ClusterIP
  persistence: true
  pvc:
    create: true
    storage: 80Gi
  nodeSelector:
    kubernetes.io/arch: amd64
  externalSecrets:
    - secretName: "sso-secret"
      mountPath: "/secrets/clientSecret"
  mountConfig: true
  configFiles:
    config.json: |-
      {
        "storage": { "rootDirectory": "/var/lib/registry" },
        "log": { "level": "info" },
        "extensions": {
          "metrics": { "enable": true },
          "search": {
            "enable": true,
            "cve": { "updateInterval": "2h" }
          },
          "ui": { "enable": true }
        },
        "http": {
          "address": "0.0.0.0",
          "port": "5000",
          "externalUrl": "https://zot.soh.re"
        }
      }

virtualService:
  hosts:
    - "zot.soh.re"
service:
  name: zot
  targetPort: 5000
name: zot-virtualservice

externalSecret:
  enabled: true
