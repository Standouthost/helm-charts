zot:
  replicaCount: 2
  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: zot-s3-credentials
          key: ZOT_SOH_RE_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: zot-s3-credentials
          key: ZOT_SOH_RE_SECRET_ACCESS_KEY
  image:
    tag: v2.1.20
  startupProbe:
    failureThreshold: 180
  strategy:
    type: RollingUpdate
  service:
    type: ClusterIP
  persistence: true
  pvc:
    create: true
    name: zot-cache
    storage: 1Gi
    storageClassName: longhorn
  serviceHeadless:
    enabled: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - '{{ .Release.Name }}'
          topologyKey: kubernetes.io/hostname
  nodeSelector:
    kubernetes.io/arch: amd64
  externalSecrets:
    - secretName: "sso-secret"
      mountPath: "/secrets/oidc"
  mountConfig: true
  configFiles:
    config.json: |-
      {
        "storage": {
          "rootDirectory": "/var/lib/registry",
          "dedupe": false,
          "remoteCache": true,
          "storageDriver": {
            "name": "s3",
            "rootdirectory": "/zot",
            "region": "garage",
            "regionendpoint": "garage.garage.svc.cluster.local:3900",
            "bucket": "zot-soh-re",
            "forcepathstyle": true,
            "secure": false,
            "skipverify": false
          },
          "cacheDriver": {
            "name": "redis",
            "url": "redis://valkey.garage.svc.cluster.local:6379",
            "keyprefix": "zot-soh-re"
          }
        },
        "log": { "level": "info" },
        "extensions": {
          "metrics": { "enable": true },
          "search": {
            "enable": true,
            "cve": { "updateInterval": "2h" }
          },
          "ui": { "enable": true }
        },
        "http": {
          "address": "0.0.0.0",
          "port": "5000",
          "externalUrl": "https://zot.soh.re",
          "auth": {
            "openid": {
              "providers": {
                "github": {
                  "credentialsFile": "/secrets/oidc/github-oidc.json",
                  "scopes": ["read:org", "user", "repo"]
                }
              }
            }
          },
          "accessControl": {
            "repositories": {
              "**": {
                "policies": [{
                  "users": ["jon@soh.re"],
                  "actions": ["read", "create", "update", "delete"]
                }],
                "defaultPolicy": ["read"],
                "anonymousPolicy": ["read"]
              }
            }
          }
        },
        "cluster": {
          "members": [
            "zot-0.zot-headless.zot.svc.cluster.local:5000",
            "zot-1.zot-headless.zot.svc.cluster.local:5000"
          ],
          "hashKey": "zotsohrecluster1"
        }
      }

virtualService:
  hosts:
    - "zot.soh.re"
service:
  name: zot
  targetPort: 5000
name: zot-virtualservice

externalSecret:
  enabled: true
  storeName: passbolt
  resourceId: a604544c-67bd-4080-ae39-27cbca345708
  clientId: Ov23liLygAflIzrCKJhi

sharedPvc:
  enabled: false
  name: zot-rwx
  storage: 80Gi
  storageClassName: longhorn
