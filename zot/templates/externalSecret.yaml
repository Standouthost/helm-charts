{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sso-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: sso-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        github-oidc.json: |-
          {"clientid":"{{ .Values.externalSecret.clientId }}","clientsecret":"{{ `{{ .clientSecret }}` }}"}
  data:
    - secretKey: clientSecret
      remoteRef:
        key: {{ .Values.externalSecret.resourceId }}
        property: password
{{- end }}
