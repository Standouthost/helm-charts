{{- if .Values.sharedPvc.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.sharedPvc.name }}
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.sharedPvc.storage }}
  storageClassName: {{ .Values.sharedPvc.storageClassName }}
{{- end }}
