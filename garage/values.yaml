garage:
  garage:
    replicationFactor: "1"
    consistencyMode: consistent
    metadataAutoSnapshotInterval: 6h
    existingRpcSecret: garage-rpc
    kubernetesSkipCrd: true
    s3:
      api:
        region: garage
        rootDomain: ".garage.garage.svc.cluster.local"
  deployment:
    replicaCount: 1
  image:
    repository: dxflrs/amd64_garage
    tag: "v2.3.0@sha256:dac0c92add4f1a0b41035e94b41036a270ffbe88a37c7ac9c3f19e6dc5bdccf2"
  persistence:
    enabled: true
    meta:
      storageClass: longhorn
      size: 2Gi
    data:
      storageClass: longhorn
      size: 200Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  readinessProbe:
    httpGet:
      path: /health
      port: 3903
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /health
      port: 3903
    initialDelaySeconds: 15
    periodSeconds: 30

passbolt:
  storeName: passbolt
  resourceId: 85652ac6-8216-4a2c-9629-bda1844bcf62

valkey:
  image: valkey/valkey:9.1-alpine@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715
  storageClassName: longhorn
  storage: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

